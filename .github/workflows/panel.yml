name: Panel Pages

on:
  push:
    branches: [main, 'vibe/**']
    paths:
      - 'panel/**'
      - '.github/workflows/panel.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: panel-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Enable Pages + configure
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build static site
        run: |
          mkdir -p site
          cp panel/index.html site/index.html
          touch site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
