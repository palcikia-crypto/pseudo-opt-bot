name: cloudflare-pages

on:
  push:
    branches: [main, 'vibe/**']
    paths: ["panel/**", ".github/workflows/cloudflare-pages.yml"]
  workflow_dispatch:
  workflow_call:
    inputs:
      directory:
        description: "Folder to publish"
        type: string
        default: "panel"
      project_name:
        description: "Cloudflare Pages project name"
        type: string
        default: "pseudo-opt-panel"

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

env:
  CF_DIR: ${{ inputs.directory || 'panel' }}
  CF_PROJECT: ${{ inputs.project_name || 'pseudo-opt-panel' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ensure Pages project exists
        run: npx wrangler@3 pages project create "$CF_PROJECT" --production-branch=main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: npx wrangler@3 pages deploy "$CF_DIR" --project-name="$CF_PROJECT" --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
